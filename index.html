<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Norte RPG — Compañero de mesa</title>
<meta name="description" content="Fichas de personajes, bestiario y reglas rápidas de Calabozos y Dragones (Norte).">
<meta name="theme-color" content="#0c1a26">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Nunito+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Escena de la Puna (luna, cerro, Runa Uturunco): fondo fijo y único de toda la app.
       El dibujo es un SVG estático puesto desde CSS; lo único vivo es el polvo de arena. -->
  <div class="escena" aria-hidden="true">
    <canvas id="polvo"></canvas>
  </div>

  <header class="app-header">
    <h1>Norte <span>RPG</span></h1>
    <p class="subtitulo">Compañero de mesa — Calabozos y Dragones</p>
  </header>

  <main id="contenido" class="contenido"></main>

  <nav class="tab-bar" aria-label="Secciones">
    <button class="tab-btn is-active" data-tab="personajes">
      <span class="tab-icono">🏔️</span><span>Personajes</span>
    </button>
    <button class="tab-btn" data-tab="bestiario">
      <span class="tab-icono">🐾</span><span>Bestiario</span>
    </button>
    <button class="tab-btn" data-tab="pnj">
      <span class="tab-icono">🔥</span><span>PNJ</span>
    </button>
    <button class="tab-btn" data-tab="reglas">
      <span class="tab-icono">🎲</span><span>Reglas</span>
    </button>
  </nav>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/escena.js" defer></script>
</body>
</html>
